[package]
name = "maatui"
version = "0.1.1"
edition = "2024"
description = "A lightweight terminal UI for controlling maa-cli"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Moyucharm/maatui"
keywords = ["maa", "arknights", "tui", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
libc = "0.2.189"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
strip-ansi-escapes = "0.2.1"
toml_edit = "0.23.10"
ureq = "2.12.1"
unicode-width = "0.2.2"
